<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Sombra suave para o lápis se destacar sobre o logo -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- BACKGROUND: Pode remover esta tag <rect> se quiser fundo 100% transparente -->
  <rect x="0" y="0" width="200" height="200" rx="40" fill="#ffffff" />

  <!-- SÍMBOLO DA UDESC -->
  <g id="udesc-logo">
    <!-- Círculo Vermelho (Cabeça/Chama) -->
    <circle cx="100" cy="45" r="22" fill="#E31837" />
    
    <!-- Base Verde (Braços/Livro) -->
    <path d="M 50,75 
             L 50,105 
             A 50,50 0 0,0 150,105 
             L 150,75 
             L 120,75 
             L 120,105 
             A 20,20 0 0,1 80,105 
             L 80,75 Z" fill="#005A36" />
  </g>

  <!-- LÁPIS DIAGONAL -->
  <!-- O lápis está agrupado e rotacionado em -45 graus no centro da imagem -->
  <g id="pencil" transform="rotate(-45 100 85)" filter="url(#shadow)">
    
    <!-- Corpo de Madeira (Ponta) -->
    <polygon points="145,75 145,95 170,85" fill="#FFE0B2" />
    <!-- Grafite da Ponta -->
    <polygon points="158,80.2 158,89.8 170,85" fill="#37474F" />

    <!-- Corpo Principal Amarelo (3 tons para dar volume) -->
    <rect x="75" y="75" width="70" height="7" fill="#FFCA28" />
    <rect x="75" y="82" width="70" height="6" fill="#FFC107" />
    <rect x="75" y="88" width="70" height="7" fill="#FFA000" />

    <!-- Aro Metálico (Prata) -->
    <rect x="55" y="75" width="20" height="20" fill="#B0BEC5" />
    <rect x="59" y="75" width="3" height="20" fill="#90A4AE" />
    <rect x="67" y="75" width="3" height="20" fill="#90A4AE" />

    <!-- Borracha Rosa com borda arredondada na ponta -->
    <path d="M 55,75 L 43,75 A 10,10 0 0,0 43,95 L 55,95 Z" fill="#F48FB1" />
  </g>

  <!-- TEXTO DO APLICATIVO -->
  <text x="100" y="185" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="32" letter-spacing="1.5" text-anchor="middle" fill="#005A36">
    EDUSC
  </text>
</svg>